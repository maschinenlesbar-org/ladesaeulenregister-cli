# How the API is accessed: open | key (env: VAR) | account (token, user, password: VARs)
access:
  type: open

de:
  # German version of the README's intro paragraph. Keep it in step with README.md.
  intro: >-
    Ein schlanker **TypeScript-Client mit CLI** für das **Ladesäulenregister** – das Register
    der Bundesnetzagentur für öffentliche Ladeeinrichtungen für E-Autos in Deutschland (rund
    116.000 Ladeeinrichtungen, Stand September 2026). Die Daten stammen aus einem öffentlichen **ArcGIS
    FeatureServer**. Eine [bund.dev](https://bund.dev)-API.
